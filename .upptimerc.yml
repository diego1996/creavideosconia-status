# Estado público de CreaVideosConIA — https://status.creavideosconia.com
# Upptime (open source, MIT): GitHub Actions revisa cada componente cada 5 minutos desde fuera de nuestro servidor;
# cada caída abre un incidente (issue) asignado y queda en el historial. Las URLs /status/<componente> de la API
# responden 200 si funciona y 503 si no (latidos de los workers, cola atascada, pasarela de pagos).
owner: diego1996
repo: creavideosconia-status

sites:
  - name: Sitio web
    url: https://creavideosconia.com
  - name: Studio (app)
    url: https://app.creavideosconia.com/login
  - name: API
    url: https://api.creavideosconia.com/status/api
  - name: Producción de vídeos
    url: https://api.creavideosconia.com/status/generation
  - name: Publicación en redes y correos
    url: https://api.creavideosconia.com/status/publishing
  - name: Pagos
    url: https://api.creavideosconia.com/status/payments
  - name: Conexión con agentes de IA (MCP)
    url: https://mcp.creavideosconia.com/.well-known/oauth-protected-resource/mcp

assignees:
  - diego1996

status-website:
  cname: status.creavideosconia.com
  logoUrl: https://creavideosconia.com/icon.png
  favicon: https://creavideosconia.com/icon.png
  name: CreaVideosConIA · Estado
  introTitle: "Estado de **CreaVideosConIA**"
  introMessage: Disponibilidad en tiempo real de cada parte de la plataforma, medida cada 5 minutos desde fuera de nuestros servidores. Si algo falla lo verás aquí con su historial; tus vídeos y créditos están a salvo.
  theme: night
  navbar:
    - title: Estado
      href: /
    - title: Ir a CreaVideosConIA
      href: https://creavideosconia.com

